desc_train_dir: Folder with one sub-folder of audio clips for each class.
desc_out_dir: Folder where the trained classifier is saved.
desc_out_format: File format of the trained classifier.
desc_fmin: Lowest frequency kept. Use the same limits when you analyse recordings.
desc_fmax: Highest frequency kept. Use the same limits when you analyse recordings.
desc_audio_speed: Below 1 slows the audio down, above 1 speeds it up. 1 means no change.
desc_crop_mode: How to cut clips that are longer than the 3-second model input.
desc_epochs: Number of passes over the training data.
desc_batch_size: Number of clips processed together in one step.
desc_learning_rate: Step size of the optimizer.
desc_hidden_units: Size of an extra hidden layer. 0 means none.
desc_dropout: Share of connections dropped at random to reduce overfitting.
desc_val_split: Share of the clips held out to measure the model.
desc_ups_mode: Balance the classes by upsampling the smaller ones.
desc_ups_ratio: Minimum size of a small class compared with the largest, after upsampling.
desc_label_smoothing: Softens the labels so the model is less overconfident.
desc_mixup: Mixes pairs of clips to help the model generalise.
desc_focal: Gives more weight to hard examples and helps when classes are unbalanced.
lbl_dark_mode: Dark mode
logo_alt: pamflow logo
res_test_title: Results on the test folder
res_test_help: One row per class, scored on clips that were never used for training. The first row averages over all classes.
lbl_eval_threshold: Threshold for precision, recall and F1
thr_opt: Best per class
thr_default: '0.5'
res_test_note: The best threshold is chosen on the test clips themselves, so precision, recall and F1 at that threshold are a little optimistic. AUPRC and AUROC do not depend on a threshold.
res_overall: All classes (average)
res_counts: Counts per class at the best threshold
