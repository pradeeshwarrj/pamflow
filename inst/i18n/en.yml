help_cache_save: The cache holds the training and test clips as processed with the frequency, speed and cropping settings below. The name gets the ending .npz if it has none.
help_cache_load: The clips, test clips, frequency range, speed and cropping come from the cache, so those settings and the test folder in this form are not used. The training folder is not read.
phase_cache: Loading the saved cache...
res_cache_mismatch: The cache was made with different frequency, speed or cropping settings than the form shows. Training used the clips as saved in the cache, with the settings listed here.
res_cache_missing: The cache file was not found, so the clips were read from the training folder instead.
