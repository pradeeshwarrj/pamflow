# English interface texts for the pamflow Shiny apps: pam_train_app() and the apps for
# standardization (std_), validation (val_) and annotation (gt_) keys.
# To add a language, copy this file to <code>.yml (for example es.yml) and translate the
# values; keys must stay the same. Texts you leave out fall back to English.
# %s and %d are filled in by the app; keep them (and their order) in your translation.
