paths:
  project_root: "."
  audio_standardized: "data/standardized"
  filtered: "data/filtered"
  metadata: "metadata"
  deployment_sheet: "metadata/deployments.csv"
  detections: "data/detections"
  validation: "data/validation"
  occupancy: "data/occupancy"
  outputs: "outputs"
  logs: "logs"
  reports: "reports"

filenames:
  # G0059_YYYYMMDD_HHMMSS.wav ; timestamps are local time
  pattern: "^(?<grid>G\\d{4})_(?<date>\\d{8})_(?<time>\\d{6})\\.wav$"
  timezone: "Asia/Kolkata"

deployments:
  has_header: true
  grid_prefix: "G"
  date_format: "%d-%m-%Y"
  time_format: "%H:%M"
  default_recovery_time: "23:59"
  columns: [deployment_id, recorder, grid, habitat, deployer, latitude, longitude,
            deploy_date, deploy_time, retrieve_date, retrieve_time]

audio:
  sample_rate: 48000
  bit_depth: 16
  min_duration_s: 1800

qc:
  gap_tolerance_s: 120
  header_chunk_size: 5000

filter:
  enabled: true
  highpass_hz: 250
  order: 8                  # 8 poles = 48 dB per octave (Butterworth)
  ffmpeg_path: "ffmpeg"
  workers: 4
  chunk_size: 200           # files per batch; progress is saved after each batch
  duration_tolerance_s: 0.5 # max allowed length difference input vs output

birdnet:
  model_dir: "models/custom_classifier"
  classifier_name: "CustomClassifier"
  min_confidence: 0.25
  overlap_s: 0
  batch_size: 32
  use_gpu: true
  workers: 4

processing:
  min_confidence: 0.5
  species_whitelist: []
  species_blacklist: []

occupancy:
  occasion_length_days: 7
