url: https://pradeeshwarrj.github.io/pamflow/

template:
  bootstrap: 5
  bootswatch: flatly
  logo: man/figures/logo.png

home:
  sidebar:
    structure: [links, license, community, authors, citation, dev]

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/pradeeshwarrj/pamflow
      aria-label: GitHub repository

reference:
  - title: "Configuration"
    contents:
      - pam_config_read
      - pam_config_validate
      - pam_load_config

  - title: "Example project"
    desc: >
      A small synthetic project (audio, deployment sheet, config) used by the
      examples in this reference.
    contents:
      - pam_example_project

  - title: "Audio Utilities (WAV + FLAC)"
    contents:
      - utils_audio
      - pam_audio_exts
      - pam_audio_pattern
      - pam_is_flac
      - pam_read_audio
      - pam_cut_audio

  - title: "Stage 0 — Standardization & Triage"
    contents:
      - pam_standardize
      - pam_standardization_app
      - pam_inspect_raw
      - pam_parse_datetime
      - pam_extract_grid

  - title: "Stage 1 — Scan & QC"
    contents:
      - pam_scan_audio
      - pam_audio_info
      - pam_audio_summary
      - pam_list_audio
      - pam_parse_filenames
      - pam_read_deployments
      - pam_match_deployments
      - pam_check_deployments
      - pam_add_qc

  - title: "Stage 2 — Filter"
    contents:
      - pam_filter_audio
      - pam_filter_one
      - pam_highpass_filter_string

  - title: "Stage 2b — Soundscape Indices"
    contents:
      - soundscape
      - pam_soundscape_run
      - pam_soundscape_one
      - pam_soundscape_batch
      - pam_soundscape_summarise
      - to_scalar_num

  - title: "Stage 2c — Soundscape Visualizations & Reports"
    contents:
      - soundscape_vis
      - pam_soundscape_run_vis
      - pam_soundscape_plot_diel
      - pam_soundscape_plot_phase
      - pam_soundscape_report

  - title: "Stage 3 — Detect"
    contents:
      - pam_detect
      - pam_assemble_detections
      - pam_pending_batches

  - title: "Stage 4 — Process"
    contents:
      - pam_process_detections
      - pam_clean_detections

  - title: "Stage 5 — Validate"
    contents:
      - pam_validate
      - pam_validation_draw
      - pam_validation_export
      - pam_validation_sample
      - pam_validation_import
      - pam_validation_pool
      - pam_validation_metrics
      - pam_validation_report
      - pam_annotate

  - title: "Stage 5b — Recall"
    contents:
      - pam_recall_draw
      - pam_recall_export
      - pam_recall_frame
      - pam_recall_sample
      - pam_recall_metrics
      - pam_recall_report

  - title: "Stage 6 — Occupancy"
    contents:
      - pam_build_occupancy
      - pam_site_id
      - pam_daily_effort
      - pam_detection_matrix
      - pam_occasion_covariates
      - pam_site_covariates

  - title: "Ecological products"
    desc: "Per-species thresholds and a site, time-bin and species table with recording effort; activity patterns and richness."
    contents:
      - pam_species_thresholds
      - pam_detection_table
      - pam_activity
      - pam_plot_activity
      - pam_richness
      - pam_plot_richness

  - title: "Stage 7 — Input for occupancy and abundance models"
    desc: "Count histories per species and site, covariates, seasons, and input ready for unmarked, ubms or spOccupancy. pamflow prepares the data; it does not fit the models."
    contents:
      - pam_count_history
      - pam_count_histories
      - pam_as_count_history
      - pam_add_site_covariates
      - pam_define_seasons
      - pam_model_input
      - pam_check_model_input

  - title: "Stage 8 — Reports"
    contents:
      - pam_report
      - pam_report_data
      - pam_report_excel

  - title: "Standalone tool — BirdNET model training (not a workflow stage)"
    desc: >
      Train your own BirdNET classifier from R or in a point-and-click app.
      Nothing in the workflow calls these functions; the trained model is used
      by pointing the `birdnet:` section of the config at it.
    contents:
      - pam_train_app
      - pam_birdnet_train_prepare
      - pam_birdnet_train
      - pam_birdnet_train_repeat
      - pam_birdnet_train_metrics

  - title: "BirdNET environment & benchmark"
    contents:
      - pam_birdnet_setup
      - pam_birdnet_doctor
      - pam_birdnet_cleanup
      - pam_birdnet_benchmark

  - title: "Utilities"
    contents:
      - pam_audio_history
      - pam_log
      - pam_run_stage
      - pam_checkpoint_read
      - pam_checkpoint_add
      - pam_check_ffmpeg
      - pam_wilson_ci

articles:
  - title: "Getting Started"
    contents:
      - pamflow-guide
