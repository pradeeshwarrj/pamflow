url: https://pradeeshwarrj.github.io/pamflow/

template:
  bootstrap: 5
  bootswatch: flatly

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/pradeeshwarrj/pamflow
      aria-label: GitHub repository

reference:
  - title: "Configuration"
    contents:
      - pam_config_read
      - pam_config_validate

  - title: "Audio Utilities (WAV + FLAC)"
    contents:
      - utils_audio
      - pam_audio_exts
      - pam_audio_pattern
      - pam_is_flac
      - pam_read_audio
      - pam_cut_audio

  - title: "Stage 1 — Scan & QC"
    contents:
      - pam_scan_audio
      - pam_audio_info
      - pam_audio_summary
      - pam_list_audio
      - pam_parse_filenames
      - pam_read_deployments
      - pam_match_deployments
      - pam_check_deployments
      - pam_add_qc

  - title: "Stage 2 — Filter"
    contents:
      - pam_filter_audio
      - pam_filter_one
      - pam_highpass_filter_string

  - title: "Stage 2b — Soundscape Indices"
    contents:
      - soundscape
      - pam_soundscape_run
      - pam_soundscape_one
      - pam_soundscape_batch
      - pam_soundscape_summarise
